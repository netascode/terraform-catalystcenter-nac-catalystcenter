---
# =============================================================================
# Access point configuration — testable data model example
#
# Validate offline:
#   nac-validate -s <nac-catalystcenter>/schemas/schema.yaml -d .
#
# Apply:
#   module "catalystcenter" {
#     source     = "netascode/nac-catalystcenter/catalystcenter"
#     yaml_files = ["access_points.nac.yaml"]
#   }
#
# Produces exactly THREE catalystcenter_access_point_configuration instances:
#   ["OFFICE_STANDARD"]   -> AP-ZRH-01, AP-ZRH-02, AP-ZRH-03
#   ["WAREHOUSE_EXT_ANT"] -> AP-ZRH-04
#   ["(hostname only)"]   -> AP-ZRH-05
# =============================================================================

defaults:
  catalyst_center:
    inventory:
      devices:
        # Opt every access point into hostname reconciliation by default.
        # AP-ZRH-03 opts back out below.
        access_point:
          manage_hostname: true
    wireless:
      # Tier 2: inherited by EVERY named configuration that does not
      # override the value. AP mode and LED state are site policy here.
      access_point_configurations:
        admin_status: true
        led_status: true
        ap_mode: LOCAL

catalyst_center:

  # ---------------------------------------------------------------------------
  # Settings live here, once. Never on the device.
  # ---------------------------------------------------------------------------
  wireless:
    access_point_configurations:

      - name: OFFICE_STANDARD
        # admin_status / led_status / ap_mode inherited from defaults
        led_brightness_level: 8
        failover_priority: HIGH
        is_assigned_site_as_location: true
        radios:
          - band: "2.4"
            role: SERVING
            admin_status: true
            channel_assignment_mode: CUSTOM
            channel_number: 6
            power_assignment_mode: CUSTOM
            power_level: 4
          - band: "5"
            role: SERVING
            channel_assignment_mode: CUSTOM
            channel_number: 36
            channel_width: 80
          - band: "6"
            role: AUTO

      - name: WAREHOUSE_EXT_ANT
        led_status: false           # overrides the default
        led_brightness_level: 1
        failover_priority: CRITICAL
        location: Warehouse Aisle 7
        primary_controller_name: WLC-ZRH-01
        primary_ip_address: 10.60.0.11
        secondary_controller_name: WLC-ZRH-02
        secondary_ip_address: 10.60.0.12
        radios:
          - band: "5"
            role: SERVING
            antenna_pattern_name: other   # required before antenna_gain applies
            antenna_gain: 12
            antenna_cable_name: other     # required before cable_loss applies
            cable_loss: 3
            channel_assignment_mode: CUSTOM
            channel_number: 149
            channel_width: 40

  # ---------------------------------------------------------------------------
  # Devices carry a reference and a rename flag. Nothing else.
  # ---------------------------------------------------------------------------
  inventory:
    devices:

      # 1. Configuration + hostname reconciliation (inherited from defaults)
      - name: AP-ZRH-01
        type: AccessPoint
        serial_number: FGL2402L1AB
        site: Global/CH/Zurich/HQ
        state: PROVISION
        device_role: ACCESS
        rf_profile: TYPICAL
        access_point:
          configuration: OFFICE_STANDARD

      # 2. Same configuration -> shares the SAME API call as AP-ZRH-01
      - name: AP-ZRH-02
        type: AccessPoint
        serial_number: FGL2402L1AC
        site: Global/CH/Zurich/HQ
        state: PROVISION
        device_role: ACCESS
        rf_profile: TYPICAL
        access_point:
          configuration: OFFICE_STANDARD

      # 3. No serial_number. Configuration still applies, resolved by
      #    name / fqdn_name. Must opt OUT of manage_hostname, which needs
      #    a serial - the plan fails with a named error otherwise.
      - name: AP-ZRH-03
        fqdn_name: AP-ZRH-03.example.com
        type: AccessPoint
        site: Global/CH/Zurich/HQ
        state: PROVISION
        device_role: ACCESS
        rf_profile: TYPICAL
        access_point:
          configuration: OFFICE_STANDARD
          manage_hostname: false

      # 4. Different configuration -> its own API call
      - name: AP-ZRH-04
        type: AccessPoint
        serial_number: FGL2402L1AD
        site: Global/CH/Zurich/Warehouse
        state: PROVISION
        device_role: ACCESS
        rf_profile: HIGH
        access_point:
          configuration: WAREHOUSE_EXT_ANT

      # 5. Rename only, no configuration -> "(hostname only)" group
      - name: AP-ZRH-05
        type: AccessPoint
        serial_number: FGL2402L1AE
        site: Global/CH/Zurich/HQ
        state: PROVISION
        device_role: ACCESS
        rf_profile: TYPICAL
        access_point:
          manage_hostname: true

      # 6. No access_point block at all. Because `manage_hostname: true` is set
      #    under defaults above, this access point STILL gets renamed and lands
      #    in the "(hostname only)" group. That is what a default means — to
      #    opt out, add `access_point: {manage_hostname: false}` as AP-ZRH-03
      #    does. The module's own defaults ship `manage_hostname: false`, so
      #    this only happens when you opt in globally.
      - name: AP-ZRH-06
        type: AccessPoint
        serial_number: FGL2402L1AF
        site: Global/CH/Zurich/HQ
        state: PROVISION
        device_role: ACCESS
        rf_profile: TYPICAL

  sites:
    areas:
      - name: CH
        parent_name: Global
      - name: Zurich
        parent_name: Global/CH
    buildings:
      - name: HQ
        parent_name: Global/CH/Zurich
        address: Example Street 1, 8000 Zurich, Switzerland
        country: Switzerland
        latitude: 47.41
        longitude: 8.59
      - name: Warehouse
        parent_name: Global/CH/Zurich
        address: Example Street 2, 8000 Zurich, Switzerland
        country: Switzerland
        latitude: 47.41
        longitude: 8.59
