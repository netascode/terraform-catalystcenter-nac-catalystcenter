---
# Canonical (schema) paths are used for the documentation. The flat legacy paths
# (network_settings, network_profiles, templates) are what the module and the
# tests read, so keep both copies in sync.
defaults:
  catalyst_center:
    authentication_templates:
      name: No Authentication
      dot1x_to_mab_fallback_timeout: 21
      wake_on_lan: false
      number_of_hosts: Unlimited
      authentication_order: dot1x
      bpdu_guard: true
    feature_templates:
      wireless:
        cleanair:
          enable: false
          device_reporting: false
          persistent_device_propagation: false
        rrm_fra:
          fra_status: false
          fra_freeze: false
          fra_interval: 3
          # Applies only to radio_band 2.4GHz_5GHz.
          fra_sensitivity: MEDIUM
    pnp:
      devices:
        type: Default
        protocol: SSH2
        image_skip: true
    inventory:
      tags:
        system_tag: false
      devices:
        role_source: MANUAL
        access_point:
          manage_hostname: false
    sites:
      floors:
        height: 3
        length: 30
        rf_model: Cubes And Walled Offices
        width: 30
        units_of_measure: feet
      global:
        network_settings:
          device_credentials:
            preserve_unmanaged_global: true
            https_write_credentials:
              port: 443
            https_read_credentials:
              port: 443
            snmpv3_credentials:
              auth_type: SHA
              privacy_type: AES128
          ip_pools:
            type: Generic
            ip_address_space: IPv4
            ip_pools_reservations:
              type: Generic
              ipv4:
                prefix: true
              ipv6:
                address_space: false
          telemetry:
            wired_data_collection: true
            enable_netflow_collector_on_devices: false
            wireless_telemetry: false
            catalyst_center_as_snmp_server: true
            catalyst_center_as_syslog_server: true
            catalyst_center_as_network_collector: true
    network_settings:
      ip_pools:
        type: Generic
        ip_address_space: IPv4
        ip_pools_reservations:
          type: Generic
          ipv4:
            prefix: true
          ipv6:
            address_space: false
      device_credentials:
        preserve_unmanaged_global: true
        https_write_credentials:
          port: 443
        https_read_credentials:
          port: 443
        snmpv3_credentials:
          auth_type: SHA
          privacy_type: AES128
      telemetry:
        wired_data_collection: true
        enable_netflow_collector_on_devices: false
        wireless_telemetry: false
        catalyst_center_as_snmp_server: true
        catalyst_center_as_syslog_server: true
        catalyst_center_as_network_collector: true
    system_settings:
      external_authentication:
        enabled: false
      authentication_and_policy_servers:
        ise:
          protocols:
            radius:
              authentication_port: 1812
              accounting_port: 1813
            tacacs:
              port: 49
        aaa:
          protocols:
            radius:
              authentication_port: 1812
              accounting_port: 1813
            tacacs:
              port: 49
    fabric:
      l3_virtual_networks:
        merge_fabric_sites: false
      transits:
        type: IP_BASED_TRANSIT
        routing_protocol_name: BGP
        multicast_over_sda_transit: false
      fabric_sites:
        authentication_template:
          name: No Authentication
        pub_sub_enabled: false
        anycast_gateways:
          layer2_flooding: false
          auto_generate_vlan_name: false
          multiple_ip_to_mac_addresses: false
          wireless_pool: false
          traffic_type: DATA
          ip_directed_broadcast: false
          intra_subnet_routing_enabled: false
          critical_pool: false
    wireless:
      rf_profiles:
        default_rf_profile: false
      security_settings:
        pre_auth_acls:
          ipv6_enabled: false
          include_auto_generated_rules: true
          rules:
            source_prefix: 32
            destination_prefix: 32
            source_ports: 1-65535
            destination_ports: 1-65535
      ap_profiles:
        remote_worker_enabled: false
        auth_type: NO-AUTH
        ssh_enabled: false
        telnet_enabled: false
        cdp_state: false
        awips_enabled: false
        awips_forensic_enabled: false
        rogue_detection: false
        rogue_detection_min_rssi: -90
        rogue_detection_transient_interval: 0
        rogue_detection_report_interval: 10
        pmf_denial_enabled: false
        mesh_enabled: false
        time_zone: Not Configured
        time_zone_offset_hour: 0
        time_zone_offset_minutes: 0
        client_limit: 0
      ssids:
        basic_service_set_client_idle_timeout: 300
        client_exclusion_timeout: 180
        basic_service_set_max_idle: true
        broadcast_ssid: true
        client_exclusion: true
        directed_multicast_service: true
        fast_lane: false
        mac_filtering: false
        neighbor_list: true
        session_timeout_enable: true
        fast_transition: ADAPTIVE
        mft_client_protection: OPTIONAL
        nas_options: []
        ssid_radio_type: Triple band operation(2.4GHz, 5GHz and 6GHz)
        session_timeout: 1800
    design:
      network_profiles:
        wireless:
          ssid_details:
            interface_name: management
          site_tags:
            flex_profile_name: default-flex-profile
    cli_templates:
      force_push_template: true
      description: ''
      language: JINJA
      composite: false
      copying_config: true
      redeploy_template: NEVER
      deployment_timeout: 300
    network_profiles:
      wireless:
        ssid_details:
          interface_name: management
        site_tags:
          flex_profile_name: default-flex-profile
    templates:
      force_push_template: true
      description: ''
      language: JINJA
      composite: false
      copying_config: true
      redeploy_template: NEVER
      deployment_timeout: 300
